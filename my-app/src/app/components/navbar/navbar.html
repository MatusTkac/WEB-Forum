<!-- Navigation Toolbar - appears at top of every page -->
<mat-toolbar>
  <!-- App title/logo -->
  <span>Forum</span>
  
  <!-- Spacer - pushes navigation links to the right -->
  <span class="spacer"></span>
  
  <!-- Link to Forum page - highlighted when active -->
  <a routerLink="/forum" routerLinkActive="active" matButton>
    <mat-icon>forum</mat-icon>Forum
  </a>
  
  <!-- Link to Create Post page - highlighted when active -->
  <a routerLink="/create-post" routerLinkActive="active" matButton>
    <mat-icon>add</mat-icon>Create Post
  </a>
  
  <!-- Spacer - pushes user info to far right -->
  <span class="spacer"></span>
  
  <!-- Store current username in variable -->
  @let user = loggedUser(); 
  
  <!-- Show user info only if logged in -->
  @if(user) {
    <!-- Display username -->
    <span>{{user}}</span>
    <!-- Logout button - calls logout() function -->
    <button matButton (click)="logout()">
      <mat-icon>logout</mat-icon>Logout
    </button>
  } @else { 
    <!-- If not logged in, login button is hidden (commented out) -->
    <!-- <a routerLink="/login" routerLinkActive="active" matButton>
      <mat-icon>login</mat-icon>Login
    </a> -->
  }
</mat-toolbar>
