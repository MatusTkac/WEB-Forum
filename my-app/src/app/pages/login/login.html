<form (ngSubmit)="submit()" #formModel="ngForm">
  <mat-card class="login-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title>Log In</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <!-- removed {{vypisAuth}} to avoid showing typed credentials -->

      <div>
        <mat-form-field>
          <mat-label>User name</mat-label>
          <input
            matInput
            name="username"
            [(ngModel)]="auth.name"
            required
            minlength="2"
            #nameField="ngModel"
            placeholder="Enter your username"
            autocomplete="off"
          />
          <mat-hint></mat-hint>
          <mat-error>
            @if(nameField.invalid) {
              @if(nameField.errors && nameField.errors['required']) { User name is required }
              @if(nameField.errors && nameField.errors['minlength']) { User name must have at least {{nameField.errors['minlength']['requiredLength']}} characters }
            }
          </mat-error>
        </mat-form-field>
      </div>

      <div>
        <mat-form-field>
          <mat-label>Enter your password</mat-label>
          <input
            matInput
            name="password"
            [(ngModel)]="auth.password"
            type="password"
            required
            placeholder="Enter your password"
            autocomplete="off"
          />
          <!-- removed visibility toggle to keep password hidden -->
        </mat-form-field>
      </div>
    </mat-card-content>

    <mat-card-actions>
      <button type="submit" matButton="tonal" [disabled]="formModel.invalid">Login</button>
    </mat-card-actions>
  </mat-card>
</form>
